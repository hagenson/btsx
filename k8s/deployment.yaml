apiVersion: apps/v1
kind: Deployment
metadata:
  name: btsx
  namespace: btsx
  labels:
    app: btsx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: btsx
  template:
    metadata:
      labels:
        app: btsx
    spec:
      containers:
      - name: btsx
        image: hagenson/btsxweb:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          protocol: TCP
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: GoogleOAuth__ClientId
          valueFrom:
            secretKeyRef:
              name: btsx-secrets
              key: GoogleOAuth__ClientId
        - name: GoogleOAuth__ClientSecret
          valueFrom:
            secretKeyRef:
              name: btsx-secrets
              key: GoogleOAuth__ClientSecret
        - name: GoogleOAuth__RedirectUri
          valueFrom:
            secretKeyRef:
              name: btsx-secrets
              key: GoogleOAuth__RedirectUri
        - name: AppConfig__SupportEmail
          valueFrom:
            secretKeyRef:
              name: btsx-secrets
              key: AppConfig__SupportEmail
        - name: Persistence__StorageDirectory
          value: "/app/data"
        - name: Persistence__EncryptionKey
          valueFrom:
            secretKeyRef:
              name: btsx-secrets
              key: Persistence__EncryptionKey
        volumeMounts:
        - name: btsx-data
          mountPath: /app/data
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
      volumes:
      - name: btsx-data
        persistentVolumeClaim:
          claimName: btsx-data
